[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mochi-pet"
version = "0.2.0"
description = "Mochi: a tiny vector desktop pet for KDE Plasma"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["PySide6>=6.6"]

[project.optional-dependencies]
monitor = ["psutil>=5.9"]                       # optional: CPU-aware reactions (v0.4)
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10", "pyinstaller>=6.6"]

[project.scripts]
mochi = "mochi.app:main"

[tool.setuptools.packages.find]
include = ["mochi*"]

[tool.setuptools.package-data]
"mochi.platform" = ["kwin.js"]

[tool.ruff]
line-length = 140                               # the code favours dense one-liners with trailing comments

[tool.ruff.lint]
select = ["E", "F", "B"]
ignore = ["E401", "E701", "E702", "E741"]       # `import a, b`, one-line `if x: y`, `a; b`, single-letter names are house style

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
